# The CI gate, as parallel jobs. scripts/ci.sh is the single source of what is
# checked: `bash scripts/ci.sh` runs everything in sequence (for local use) and
# each job here runs one group of it (`checks`, `test N/M`, `smoke`, `build`,
# `browser`), so together the jobs run the same checks, none skipped or weakened.
# The public website tests have their own job (`public-browser`) here.
#
# THE `ci` JOB IS AN AGGREGATOR AND ITS NAME MATTERS. Branch protection on main
# requires the status checks named exactly `ci` and `public-browser`. The work
# is split over several jobs, so `ci` does no work itself: it needs all of them,
# runs `if: always()` (a skipped or failed needed job must not leave it
# "skipped", which a required check would treat as passing or as missing), and
# fails unless every needed job's result is `success`. Do not rename `ci` or
# `public-browser`, and add every new job of the gate to the `needs:` list of `ci`.
#
# Caches. setup-go's built-in cache is keyed on go.sum only, so it is written
# once and goes stale as the code changes. Instead each job restores the newest
# Go build and module cache of its own kind (key: go.sum hash plus the run id,
# found through restore-keys prefixes) and only a push to main saves a new one,
# so pull requests never thrash the repository's 10 GB cache budget but start
# from main's newest. The bun and Playwright caches are keyed on the lock file and
# saved the same way. Release runs (a tag) only restore.
#
# Secrets scanning (`secrets`) runs gitleaks over the whole history; its reviewed
# false positives (test fixtures) are in .gitleaksignore, each with its reason. It
# is a CI-only job: scripts/ci.sh does not run it.
#
# Also callable from other workflows (release.yml runs it before building anything).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Trailers, gofmt, the React typecheck/docs check/unit tests/build, vet, the API
  # snapshot, the capability matrix, the shard map, staticcheck and govulncheck.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (v2)
        with:
          bun-version: 1.4.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v7)
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-checks-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-${{ runner.os }}-checks-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-checks-
      - id: buncache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: scripts/ci.sh checks
        run: ./scripts/ci.sh checks
      - name: Save the Go cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}
      - name: Save the bun cache (main only)
        if: ${{ !cancelled() && steps.buncache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.buncache.outputs.cache-primary-key }}

  # The race test suite, split into shards by package (scripts/ci.sh explains the
  # split). Every shard has a PostgreSQL service, so each runs both databases.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    services:
      postgres:
        image: postgres:17@sha256:b8faeff7712663c2773a190181e1246e37e364b887611c04658c28b44e2408fe
        env:
          POSTGRES_PASSWORD: paymux
          POSTGRES_DB: paymux
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      # The tests use this server instead of starting a container, and
      # PAYMUX_REQUIRE_PG turns a missing database into a failure rather than a
      # silent skip.
      PAYMUX_TEST_POSTGRES_URL: postgres://postgres:paymux@localhost:5432/paymux?sslmode=disable
      PAYMUX_REQUIRE_PG: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (v2)
        with:
          bun-version: 1.4.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v7)
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test${{ matrix.shard }}-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-${{ runner.os }}-test${{ matrix.shard }}-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-test${{ matrix.shard }}-
            go-${{ runner.os }}-test
      - id: buncache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      # The tests see the built dashboard bundle, as they did when the build ran
      # before them in one job.
      - name: Build the dashboard bundle
        run: |
          bun install --cwd frontend --frozen-lockfile
          bun run --cwd frontend build:dashboard
      - name: scripts/ci.sh test ${{ matrix.shard }}/6
        run: ./scripts/ci.sh test ${{ matrix.shard }}/6
      - name: Save the Go cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}
      - name: Save the bun cache (main only)
        if: ${{ !cancelled() && steps.buncache.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' && matrix.shard == 1 }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: ${{ steps.buncache.outputs.cache-primary-key }}

  # The smoke test of the real binary on SQLite.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (v2)
        with:
          bun-version: 1.4.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v7)
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-smoke-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-${{ runner.os }}-smoke-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-smoke-
      - id: buncache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: scripts/ci.sh smoke
        run: ./scripts/ci.sh smoke
      - name: Save the Go cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  # The cross builds (linux/amd64 and arm64) and the docker image build.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (v2)
        with:
          bun-version: 1.4.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v7)
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-${{ runner.os }}-build-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-build-
      - id: buncache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - name: scripts/ci.sh build
        run: ./scripts/ci.sh build
      - name: Save the Go cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}

  # The dashboard browser tests (the hub on a seeded throw-away data directory).
  dashboard-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (v2)
        with:
          bun-version: 1.4.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v7)
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-dashboard-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-${{ runner.os }}-dashboard-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-dashboard-
      - id: buncache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-shell-${{ hashFiles('frontend/bun.lock') }}
      - name: scripts/ci.sh browser
        run: ./scripts/ci.sh browser
      - name: Save the Go cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}
      - name: Save the Playwright browsers (main only)
        if: ${{ !cancelled() && steps.browsers.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}

  # gitleaks over the full history. Findings that are test fixtures are listed in
  # .gitleaksignore with the reason; anything else fails the gate.
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          persist-credentials: false
          fetch-depth: 0 # the whole history is scanned
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # The aggregator: see the comment at the top. Its name is a required status check.
  ci:
    if: ${{ always() }}
    needs: [checks, test, smoke, build, dashboard-browser, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: every job of the gate must have succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' >/dev/null

  # The public website's browser tests. Its name is a required status check.
  public-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (v2)
        with:
          bun-version: 1.4.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v7)
        with:
          go-version-file: go.mod
          cache: false
      - id: gocache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-website-${{ hashFiles('go.sum') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            go-${{ runner.os }}-website-${{ hashFiles('go.sum') }}-
            go-${{ runner.os }}-website-
      - id: buncache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('frontend/bun.lock') }}
      - id: browsers
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-chromium-${{ hashFiles('frontend/bun.lock') }}
      - run: bun install --cwd frontend --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
        working-directory: frontend
      - run: bun run --cwd frontend test:home
      - name: Save the Go cache (main only)
        if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ steps.gocache.outputs.cache-primary-key }}
      - name: Save the Playwright browsers (main only)
        if: ${{ !cancelled() && steps.browsers.outputs.cache-hit != 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.browsers.outputs.cache-primary-key }}
