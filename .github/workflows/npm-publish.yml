# Publish the JavaScript SDK from a directory-prefixed version tag. The release
# environment provides a manual approval boundary before npm or GitHub changes.
name: Publish JavaScript SDK

on:
  push:
    tags: ["sdk/js/v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (v2)
        with:
          bun-version: 1.4.3
      - name: Verify release tag
        working-directory: sdk/js
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$RELEASE_TAG" = "sdk/js/v$version"
          test "$(node -p "require('./package.json').name")" = "@paymux-js/sdk"
      - name: Test and build
        working-directory: sdk/js
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test
          bun run build
          npm pack --dry-run
      - name: Publish to npm with trusted publishing
        working-directory: sdk/js
        run: npm publish --access public
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --generate-notes --title "JavaScript SDK ${RELEASE_TAG#sdk/js/}"
