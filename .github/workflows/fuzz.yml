# Nightly fuzzing of the parsers and verifiers that read data from outside:
# every Fuzz target of the packages below runs for 10 minutes. It runs on a
# schedule (and by hand) only, never on a pull request, so it cannot hold up
# a merge. A failing input is written to testdata/fuzz/<target>/ by the Go
# tool; the job uploads those files, and the corpus the run built up, as an
# artifact. To keep a finding, copy the failing file into the package's
# testdata/fuzz directory and commit it with the fix.
name: Fuzz

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        package:
          - ./connectors/cashfree
          - ./connectors/payu
          - ./connectors/razorpay
          - ./connectors/stripe
          - ./connectors/whop
          - ./connectors/zoho
          - ./internal/tax
          - ./pkg/connector/money
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v7)
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz every target of ${{ matrix.package }} for 10 minutes
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          set -euo pipefail
          targets=$(go test -list '^Fuzz' "$PACKAGE" | grep '^Fuzz' || true)
          if [ -z "$targets" ]; then
            echo "no Fuzz target in $PACKAGE" >&2
            exit 1
          fi
          failed=0
          for t in $targets; do
            echo "::group::$PACKAGE $t"
            go test "$PACKAGE" -run '^$' -fuzz "^${t}\$" -fuzztime 10m || failed=1
            echo "::endgroup::"
          done
          exit $failed
      - name: Upload failing inputs and the corpus
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ strategy.job-index }}
          path: |
            **/testdata/fuzz/**
            ~/.cache/go-build/fuzz/**
          if-no-files-found: ignore
          retention-days: 14
