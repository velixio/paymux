# Release on a version tag (v1.2.3): run the whole CI gate, build the archives
# with scripts/release.sh, sign SHA256SUMS with cosign (keyless, using this
# workflow's OIDC identity) and publish a GitHub release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    # A called workflow cannot exceed its caller: grant what ci.yml's jobs ask
    # for (the gitleaks job reads pull requests), or the run does not start.
    permissions:
      contents: read
      pull-requests: read

  release:
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A protected environment ("release"): its required reviewers must approve
    # before this job starts, so a pushed tag alone cannot publish or sign anything.
    environment: release
    permissions:
      contents: write # create the release and upload the assets
      id-token: write # keyless cosign signing and the build provenance
      attestations: write # the build provenance attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (v7)
        with:
          persist-credentials: false
          fetch-depth: 0 # the tag and history, for the release notes and SOURCE_DATE_EPOCH
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0 (v2)
        with:
          bun-version: 1.4.3
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0 (v7)
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # cosign v3 signs SHA256SUMS as a Sigstore bundle (scripts/release.sh);
          # pinned so that a bump of the installer cannot change it unseen.
          cosign-release: v3.0.6
      - name: Build, checksum and sign
        env:
          TAG: ${{ github.ref_name }}
          OUT: dist/release
        run: ./scripts/release.sh "$TAG"
      - name: Attest the build provenance of the archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/release/*.tar.gz
            dist/release/install.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/release/* \
            --verify-tag \
            --generate-notes \
            --title "$TAG"
