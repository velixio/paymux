{{define "title"}}{{t "billing.title"}}{{end}}
{{define "content"}}
<form method="post" action="{{.FormURL}}">
<input type="hidden" name="csrf" value="{{.CSRF}}">
{{with .Error}}<p class="error">{{.}}</p>{{end}}
<input class="field" name="name" placeholder="{{t "billing.name"}}" value="{{.Billing.Name}}" required>
<input class="field" name="email" type="email" placeholder="{{t "billing.email"}}" value="{{.Billing.Email}}">
{{if .IndiaStates}}<select class="field" name="state_code" {{if .StateRequired}}required{{end}}>
<option value="">{{t "billing.state"}}</option>
{{range .IndiaStates}}<option value="{{.Code}}" {{if eq .Code $.Billing.StateCode}}selected{{end}}>{{.Name}}</option>{{end}}
</select>{{end}}
{{if .AddressRequired}}<input class="field" name="line1" placeholder="{{t "billing.address"}}" value="{{.Billing.Line1}}" required>
<input class="field" name="postal_code" placeholder="{{t "billing.pin"}}" value="{{.Billing.PostalCode}}" required>{{end}}
<details><summary class="muted">{{t "billing.gst_toggle"}}</summary>
<input class="field" name="gstin" placeholder="{{t "billing.gstin"}}" value="{{.Billing.GSTIN}}">
<input class="field" name="legal_name" placeholder="{{t "billing.legal_name"}}" value="{{.Billing.LegalName}}">
</details>
<button class="btn" type="submit">{{t "billing.continue"}}</button>
</form>
{{end}}
