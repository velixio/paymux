{{define "dash_provider_fields"}}{{with .Prov}}
{{range .Fields}}
<label>{{.Title}}{{if .Required}} *{{end}}
{{if .Enum}}<select class="field" name="cfg_{{.Name}}">{{if not .Required}}<option value="">(not set)</option>{{end}}{{range .Enum}}<option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Value}}</option>{{end}}</select>
{{else if eq .Type "boolean"}}<input type="checkbox" name="cfg_{{.Name}}" value="1"{{if .Checked}} checked{{end}}>
{{else if .Secret}}<input class="field" type="password" name="cfg_{{.Name}}" autocomplete="new-password" placeholder="{{if .HasValue}}set - leave blank to keep{{else}}secret{{end}}">
{{else if or (eq .Type "integer") (eq .Type "number")}}<input class="field" type="number" step="any" name="cfg_{{.Name}}" value="{{.Value}}">
{{else}}<input class="field" name="cfg_{{.Name}}" value="{{.Value}}"{{if .Required}} required{{end}}>{{end}}
</label>
{{end}}
<fieldset><legend>Accepted currencies</legend>{{range .Currencies}}<label class="inline"><input type="checkbox" name="currency" value="{{.Value}}"{{if .Checked}} checked{{end}}> {{.Value}}</label> {{end}}</fieldset>
<fieldset><legend>Enabled purposes</legend>{{range .Purposes}}<label class="inline"><input type="checkbox" name="purpose" value="{{.Value}}"{{if .Checked}} checked{{end}}> {{.Value}}</label> {{end}}</fieldset>
{{end}}{{end}}
