# nginx in front of Paymux for paymux.shimul.me.
#
# nginx runs on a separate device and proxies to the Paymux host on the LAN
# (192.168.0.174:8050, PAYMUX_LISTEN=0.0.0.0:8050). Install on the nginx
# device as /etc/nginx/sites-available/paymux.shimul.me.conf, link it into
# sites-enabled (the certificate is the shimul.me one under /etc/ssl/sentinel),
# then `nginx -t && systemctl reload nginx`.
#
# On the Paymux host, set in .env / paymux.env:
#     PAYMUX_BASE_URL=https://paymux.shimul.me
#     PAYMUX_TRUSTED_PROXIES=<nginx device LAN IP>/32
# so the hub believes the client address nginx forwards (login lockout,
# audit), and firewall port 8050 so only the nginx device can reach it.
#
# Never proxy the internal listener (PAYMUX_INTERNAL_LISTEN, :9100): it serves
# metrics and the TLS ask endpoint and must stay on the Paymux host.
#
# App custom domains (pay.yourapp.com): nginx has no on-demand TLS, so add one
# server block per domain, copied from the one below, with its own
# certificate. Paymux serves only customer-facing pages on those hosts.

upstream paymux {
	server 192.168.0.174:8050;
	keepalive 16;
}

server {
	listen 80;
	listen [::]:80;
	server_name paymux.shimul.me;
	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name paymux.shimul.me;

	ssl_certificate     /etc/ssl/sentinel/shimul.me/fullchain.pem;
	ssl_certificate_key /etc/ssl/sentinel/shimul.me/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:paymux:10m;

	add_header Strict-Transport-Security "max-age=31536000" always;
	add_header X-Content-Type-Options "nosniff" always;
	server_tokens off;

	# 1 MiB webhooks; the dashboard takes evidence uploads of a few MiB.
	client_max_body_size 40m;

	location / {
		proxy_pass http://paymux;
		proxy_http_version 1.1;
		proxy_set_header Connection "";

		proxy_set_header Host $host;
		# Overwrite, never append: the hub trusts this header from the proxy
		# only, and a client-supplied value must not reach it.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_set_header X-Forwarded-Host $host;

		# Webhook signatures cover the exact body: pass it through untouched.
		proxy_request_buffering off;

		proxy_connect_timeout 5s;
		proxy_read_timeout 60s;
		proxy_send_timeout 60s;
	}
}
