openapi: 3.1.0
info:
  title: Paymux API
  version: 0.1.0
  summary: Create and manage payments and refunds.
  description: |
    All amounts are integers in minor units (paise for INR) with an ISO 4217
    currency code. Timestamps are RFC 3339 UTC.

    **Authentication.** Send `Authorization: Bearer pmx_{test|live}_sk_<key>`.
    The key decides the app and the mode: a `test` key only sees test data and
    a `live` key only live data.

    **Scopes.** An API key may be limited to some scopes: `payments:read`,
    `payments:write`, `refunds:read`, `refunds:write`, `subscriptions:read`,
    `subscriptions:write`, `invoices:read`, `payouts:read` and `payouts:write`. `x:write` also allows the reads
    of `x`. Each operation names the scope it needs in `x-required-scope`; a key
    without it gets 403 `insufficient_scope`. Keys created before scopes
    existed, and keys created without any, have every scope except the payouts ones (`payouts:read`,
    `payouts:write`), which a key has only when they are listed: sending money out is always a deliberate grant.

    **Idempotency.** `POST` requests may carry an `Idempotency-Key` header
    (up to 255 characters). The same key with the same method, path and body
    within 24 hours returns the stored response (marked
    `Idempotent-Replay: true`). The same key with a different request returns
    409 `idempotency_key_reuse`. A repeat while the first is still running
    returns 409 `idempotency_in_progress`. Responses with status 5xx are not
    stored, so those requests can be retried.

    **Return URLs are not proof of payment.** After paying, the customer is sent to the
    payment's `return_url` with `status` (and the payment id) in the query string. That
    query string is not signed: anyone can edit it or open the address by hand. Confirm a
    payment only from the `payment.succeeded` event or by `GET`ting the payment.

    **Rate limit.** 20 requests per second per API key (token bucket). Over the
    limit the API answers 429 `rate_limited` with a `Retry-After` header in
    seconds; the request is not processed.

    **Errors** share one shape: `{"error": {"type", "message", "request_id"}}`.
    The same id is in the `X-Request-Id` header of every response. Send your own
    `X-Request-Id` (letters, digits and hyphens, up to 64 characters) to match a
    call to your records, and quote the id when you ask for help: it finds the
    request in the hub's Logs page, together with the failed provider call, if
    there was one.

    **Provider rejections.** When the payment provider itself refuses a request
    ("currency is not supported", "only offers can be updated for card
    subscriptions"), the call answers 422 `provider_rejected` with the provider's
    message (scrubbed of credentials and personal data, and cut to 300
    characters). It is the request to fix, not a Paymux fault: do not retry it
    unchanged. 422 `unsupported` says the provider cannot do what was asked at
    all. A provider outage is not one of these; it answers 5xx and can be retried.
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: https://pay.example.com
security:
  - bearerAuth: []
paths:
  /v1/payments:
    post:
      operationId: createPayment
      x-required-scope: payments:write
      summary: Create a payment
      description: |
        Creates a payment in status `created` and returns a `checkout_url` of
        the form `<PAYMUX_BASE_URL>/pay/<id>?t=<secret>`. The secret is shown
        once and valid until `expires_at`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPayment"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          description: |
            `no_route` (no provider account can take this payment) or
            `currency_not_accepted` (a routing rule rejects it; the message is the rule's).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/InvalidRequest"
    get:
      operationId: listPayments
      x-required-scope: payments:read
      summary: List payments
      description: Newest first, cursor-paginated.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: starting_after
          in: query
          description: The `next_cursor` of the previous page.
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PaymentStatus" }
      responses:
        "200":
          description: A page of payments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
  /v1/payments/{id}:
    get:
      operationId: getPayment
      x-required-scope: payments:read
      summary: Retrieve a payment
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: The payment, with its attempts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentDetail"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payments/{id}/cancel:
    post:
      operationId: cancelPayment
      x-required-scope: payments:write
      summary: Cancel a payment
      description: |
        Only payments in `created` or `requires_action` can be canceled.
        Canceling a canceled payment returns it unchanged. A late success after
        a cancel moves the payment to `needs_review`; it is never refunded
        automatically.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The canceled payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /v1/payments/{id}/refunds:
    post:
      operationId: createRefund
      x-required-scope: refunds:write
      summary: Refund a payment
      description: |
        Refunds the succeeded attempt (or `attempt_id`). `amount` defaults to
        everything still refundable. The refund starts `pending` and is sent to
        the provider asynchronously.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: Refund created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RefundConflict"
  /v1/refunds/{id}:
    get:
      operationId: getRefund
      x-required-scope: refunds:read
      summary: Retrieve a refund
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^ref_[0-9a-z]{26}$" }
      responses:
        "200":
          description: The refund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/invoices:
    get:
      operationId: listInvoices
      x-required-scope: invoices:read
      summary: List the invoices of a payment
      description: |
        `payment_id` is required (400 `invalid_request` without it): invoices are listed per
        payment, there is no list of all invoices. Empty when the payment has no invoice (the
        app issues none, or the provider is merchant of record).
      parameters:
        - name: payment_id
          in: query
          required: true
          schema: { type: string, pattern: "^pay_[0-9a-z]{26}$" }
      responses:
        "200":
          description: The invoices.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvoiceList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
  /v1/invoices/{id}:
    get:
      operationId: getInvoice
      x-required-scope: invoices:read
      summary: Retrieve an invoice
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^inv_[0-9a-z]{26}$" }
      responses:
        "200":
          description: The invoice.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Invoice"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/invoices/{id}/pdf:
    get:
      operationId: getInvoicePdf
      x-required-scope: invoices:read
      summary: Download an invoice as PDF
      description: 404 with `Retry-After` while the PDF is still being rendered (`pdf_ready` is false).
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^inv_[0-9a-z]{26}$" }
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/credit_notes:
    get:
      operationId: listCreditNotes
      x-required-scope: invoices:read
      summary: List the credit notes of a payment
      description: "`payment_id` is required (400 `invalid_request` without it): credit notes are listed per payment."
      parameters:
        - name: payment_id
          in: query
          required: true
          schema: { type: string, pattern: "^pay_[0-9a-z]{26}$" }
      responses:
        "200":
          description: The credit notes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditNoteList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
  /v1/credit_notes/{id}:
    get:
      operationId: getCreditNote
      x-required-scope: invoices:read
      summary: Retrieve a credit note
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^crn_[0-9a-z]{26}$" }
      responses:
        "200":
          description: The credit note.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditNote"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/credit_notes/{id}/pdf:
    get:
      operationId: getCreditNotePdf
      x-required-scope: invoices:read
      summary: Download a credit note as PDF
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^crn_[0-9a-z]{26}$" }
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment_links:
    post:
      operationId: createPaymentLink
      x-required-scope: payments:write
      summary: Create a payment link
      description: |
        A payment link is a shareable page at `<PAYMUX_BASE_URL>/l/<slug>` (also served on the app's custom domains).
        The customer enters their name, email and optionally phone (and, where the usual rules require it, their billing
        details), and Paymux creates a normal payment for them with `metadata.payment_link_id` set to the link's id and
        `order_ref` set to the link's id, then sends them into the usual pay flow. You get the usual `payment.*` events.

        Give either a fixed `amount`, or `min_amount` (and optionally `max_amount`) to let the customer choose.
        A **reusable** link takes any number of payments. A **single-use** link is held by the first visitor while their
        payment is open (other visitors are asked to try later), and switches itself off when the first payment succeeds
        (`payment_link.deactivated` with `deactivated_reason: used`). An `expires_at` makes the page stop taking payments.
        The `payment_link.created` and `payment_link.deactivated` events carry the link.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentLinkRequest"
      responses:
        "201":
          description: The link, with its public `url`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
    get:
      operationId: listPaymentLinks
      x-required-scope: payments:read
      summary: List payment links
      parameters:
        - { name: active, in: query, required: false, schema: { type: boolean }, description: Only active (true) or switched-off (false) links. }
        - { name: starting_after, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 25 } }
      responses:
        "200":
          description: A page of links of this key's app and mode, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLinkList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/payment_links/{id}:
    get:
      operationId: getPaymentLink
      x-required-scope: payments:read
      summary: Retrieve a payment link
      parameters:
        - $ref: "#/components/parameters/PaymentLinkId"
      responses:
        "200":
          description: The link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payment_links/{id}/deactivate:
    post:
      operationId: deactivatePaymentLink
      x-required-scope: payments:write
      summary: Deactivate a payment link
      description: |
        Switches the link off for good: its page shows that the link is no longer active and creates no more payments.
        Payments already started keep working. Repeating the call returns the link unchanged and sends no second event.
      parameters:
        - $ref: "#/components/parameters/PaymentLinkId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The inactive link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentLink"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/subscriptions:
    post:
      operationId: createSubscription
      x-required-scope: subscriptions:write
      summary: Create a subscription
      description: |
        Routes the subscription (provider-managed, or merchant-triggered with a mandate) and returns it
        `incomplete` with a `checkout_url` (`/s/{id}?t=...`) for the customer. Setup must finish within 24 hours.
        An amount above what a mandate allows (Rs 15,000 for UPI and card) is billed through an e-NACH mandate or a
        provider-managed account; if neither exists the call fails with 422 `amount_exceeds_mandate_limit`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionRequest"
      responses:
        "201":
          description: The incomplete subscription and its checkout link.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSubscription"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "422":
          $ref: "#/components/responses/SubscriptionUnprocessable"
    get:
      operationId: listSubscriptions
      x-required-scope: subscriptions:read
      summary: List subscriptions
      parameters:
        - { name: customer, in: query, required: false, schema: { type: string } }
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/SubscriptionStatus" } }
        - { name: starting_after, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
      responses:
        "200":
          description: A page of subscriptions, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
  /v1/subscriptions/{id}:
    get:
      operationId: getSubscription
      x-required-scope: subscriptions:read
      summary: Retrieve a subscription
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/subscriptions/{id}/cancel:
    post:
      operationId: cancelSubscription
      x-required-scope: subscriptions:write
      summary: Cancel a subscription
      description: |
        Now (revokes the mandate or cancels at the provider) or, with `at_period_end`, at the end of the
        current period. Canceling a canceled subscription succeeds.
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                at_period_end: { type: boolean, default: false }
              additionalProperties: false
      responses:
        "200":
          description: The subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /v1/subscriptions/{id}/update:
    post:
      operationId: updateSubscription
      x-required-scope: subscriptions:write
      summary: Change the amount from the next period, optionally prorating the current one
      description: |
        The new amount applies from the next period. `proration` says what happens to the rest of the current
        period (merchant-triggered subscriptions; the difference is `(new - old) x remaining seconds / period
        seconds`, rounded to the nearest minor unit):

        - `none` (default): nothing; the current period stays as paid.
        - `next_invoice`: the difference is added to the next renewal (an upgrade) or taken off it (a downgrade).
        - `immediate`: an upgrade's difference is charged as soon as the rules allow: the customer gets a
          pre-debit notice now and the debit runs at least 24 hours later, as a separate charge (`charge_at` in
          the `proration` object). If that cannot be done now (no active mandate, a re-authorization under way,
          the amount above the mandate maximum) it is added to the next renewal instead and `proration.reason`
          says why. A downgrade is a credit on the next renewal, as with `next_invoice`.

        A credit is never refunded automatically; one larger than the next renewal carries over to the ones after
        it (a renewal is never below one minor unit). The prorated amounts appear as separate lines on the invoice.
        Provider-managed subscriptions are billed by the provider and answer 422 `unsupported` to any proration
        other than `none`. A change on a subscription that is not active, or at the very end of the period, has
        nothing to prorate (`proration.reason`).

        If the new amount is above the mandate's maximum the response has
        `requires_reauthorization: true` and a new `checkout_url`, and `subscription.reauthorization_required`
        fires; the new amount applies once the customer authorises the larger mandate.
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount]
              properties:
                amount: { type: integer, minimum: 1, description: Minor units per period. }
                proration:
                  type: string
                  enum: [none, next_invoice, immediate]
                  default: none
              additionalProperties: false
      responses:
        "200":
          description: The subscription (with `checkout_url` when re-authorization is needed, and `proration` when a prorated change was requested).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSubscription"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/SubscriptionUnprocessable"
  /v1/subscriptions/{id}/payment_method:
    post:
      operationId: updateSubscriptionPaymentMethod
      x-required-scope: subscriptions:write
      summary: Start a new mandate checkout
      description: |
        Returns a `checkout_url` for a new mandate. The old mandate is revoked once the new one is active.
        Not available for provider-managed subscriptions (422 `unsupported`).
      parameters:
        - $ref: "#/components/parameters/SubscriptionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [upi, card, emandate], description: Default is the current mandate's method. }
              additionalProperties: false
      responses:
        "200":
          description: The subscription with the new `checkout_url`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedSubscription"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
        "422":
          $ref: "#/components/responses/SubscriptionUnprocessable"
  /v1/payouts:
    post:
      operationId: createPayout
      x-required-scope: payouts:write
      summary: Send money out to a beneficiary
      description: |
        Records the payout (`pending`) and submits it to the provider in the background; follow it with
        `payout.processing`, `payout.succeeded`, `payout.failed`, `payout.reversed` and `payout.needs_review` events or `GET`. The
        provider is sent the payout's own reference as an idempotency token, so a retry never pays twice. The
        `Idempotency-Key` header is required (400 `invalid_request` without it): a client that retries after a
        timeout must not send the money twice.

        This is the only operation an ordinary key cannot do: the key must list `payouts:write` explicitly (keys
        with no scope list do not have it), and a provider account of the app must have the `payout` purpose and a
        connector that can pay out. The beneficiary is stored encrypted and shown masked.

        While a payout to the same beneficiary (account or UPI id), amount and currency is in `needs_review` (the
        provider may already have paid it), a new one is refused with 409 `payout_needs_review`. Resolve the first,
        or send `force: true`: it is recorded in the audit log under the key that sent it.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyRequired"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amount, currency, beneficiary]
              properties:
                amount: { type: integer, minimum: 1, description: Minor units. }
                currency: { type: string, examples: [INR] }
                beneficiary:
                  type: object
                  description: Either a bank account (`account_number` and `ifsc`) or a `upi` id.
                  required: [name]
                  properties:
                    name: { type: string, maxLength: 100 }
                    account_number: { type: string, pattern: "^[0-9]{6,20}$" }
                    ifsc: { type: string, pattern: "^[A-Z]{4}0[A-Z0-9]{6}$" }
                    upi: { type: string }
                    email: { type: string }
                    phone: { type: string }
                  additionalProperties: false
                narration: { type: string, maxLength: 100 }
                metadata: { type: object, additionalProperties: { type: string } }
                provider_account_id: { type: string, description: Pick the provider account (default the app's first that accepts payouts in the currency). }
                force: { type: boolean, description: "Send although a payout to the same beneficiary and amount is in `needs_review`. Audited." }
              additionalProperties: false
      responses:
        "201":
          description: The pending payout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "409":
          description: "`payout_needs_review`: a payout to the same beneficiary and amount is in `needs_review`; see `force`."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: "`no_route`: no provider account of the app accepts payouts in this currency."
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
    get:
      operationId: listPayouts
      x-required-scope: payouts:read
      summary: List payouts
      parameters:
        - { name: status, in: query, required: false, schema: { $ref: "#/components/schemas/PayoutStatus" } }
        - { name: starting_after, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 100, default: 10 } }
      responses:
        "200":
          description: A page of payouts, newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayoutList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
  /v1/payouts/{id}:
    get:
      operationId: getPayout
      x-required-scope: payouts:read
      summary: Retrieve a payout
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^po_[0-9a-z]{26}$" } }
      responses:
        "200":
          description: The payout.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payout"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/InsufficientScope"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "`pmx_test_sk_...` or `pmx_live_sk_...`. Optionally limited to scopes, see the API description (`x-required-scope` per operation)."
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 255 }
    SubscriptionId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^sub_[0-9a-z]{26}$" }
    PaymentLinkId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^plink_[0-9a-z]{26}$" }
    PaymentId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^pay_[0-9a-z]{26}$" }
  responses:
    InvalidRequest:
      description: The request is invalid (`invalid_request`), or the body is over 1 MiB (413).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing, malformed, unknown or revoked API key (`authentication_error`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    InsufficientScope:
      description: The API key is limited to scopes that do not include the one this operation needs (`insufficient_scope`); see `x-required-scope`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such object for this app and mode (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StateConflict:
      description: The object is in a state that does not allow this (`invalid_state`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyConflict:
      description: |
        `idempotency_key_reuse` (same key, different request) or
        `idempotency_in_progress` (the first request is still running).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    SubscriptionUnprocessable:
      description: |
        `amount_exceeds_mandate_limit` (no e-NACH or provider-managed account can bill the amount),
        `no_route` (no subscription-capable provider account for the currency), `unsupported`, or
        `provider_rejected` (the provider refused the request; the message is the provider's).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RefundConflict:
      description: |
        `not_refundable` (no succeeded attempt), `refund_amount_exceeds_balance`,
        or an idempotency conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message, request_id]
          properties:
            type:
              type: string
              enum:
                - invalid_request
                - authentication_error
                - permission_error
                - insufficient_scope
                - not_found
                - invalid_state
                - not_refundable
                - refund_amount_exceeds_balance
                - conflict
                - no_route
                - payout_needs_review
                - currency_not_accepted
                - idempotency_key_reuse
                - idempotency_in_progress
                - rate_limited
                - amount_exceeds_mandate_limit
                - unsupported
                - provider_rejected
                - provider_rejected
                - internal
            message: { type: string }
            request_id:
              type: string
              description: The id of this request, also sent as the X-Request-Id header. It identifies the matching rows of the hub's Logs page.
    PaymentStatus:
      type: string
      enum: [created, requires_action, processing, succeeded, failed, expired, canceled, needs_review]
    Customer:
      type: object
      properties:
        external_ref: { type: string, maxLength: 255, description: Your id for the customer; repeat calls update the same customer. }
        name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 32 }
        billing:
          type: object
          properties:
            legal_name: { type: string }
            gstin: { type: string }
            line1: { type: string }
            line2: { type: string }
            city: { type: string }
            state_code: { type: string }
            postal_code: { type: string }
            country: { type: string, description: "ISO 3166 alpha-2 country of the buyer. Anything other than IN makes the sale an export for GST (IGST, or zero-rated under a valid LUT when paid in a foreign currency). Empty means India." }
          additionalProperties: false
      additionalProperties: false
    CreatePaymentRequest:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
          minimum: 1
          description: |
            Minor units. Normally this is exactly what the customer pays. When the app issues
            invoices and its tax profile has `prices_include_tax=false`, `amount` is the
            **taxable value** instead: Paymux charges the taxable value plus GST at the
            profile's rate (none for a zero-rated export under a valid LUT), the payment's
            `amount` in the response is that total, and the invoice total equals
            `amount_received`. Amounts are never silently reinterpreted otherwise.
        currency: { type: string, pattern: "^[A-Za-z]{3}$", description: ISO 4217. }
        order_ref: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 1000 }
        customer: { $ref: "#/components/schemas/Customer" }
        metadata:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 500 }
          description: Up to 20 string keys (key length 1-40).
        return_url: { type: string, format: uri, description: "Absolute http(s) URL. Defaults to the app's return URL." }
        allowed_connectors:
          type: array
          items: { type: string }
          description: Restricts routing to these connectors, for the whole life of the payment (the pay page, retries and fallbacks included); a payment no listed connector can take is refused with 422 `no_route`.
        country: { type: string, description: Buyer country, matched by routing rules. }
      additionalProperties: false
    Payment:
      type: object
      required: [id, object, status, kind, amount, currency, amount_received, amount_refunded, metadata, expires_at, created_at, version, flags]
      properties:
        id: { type: string, pattern: "^pay_[0-9a-z]{26}$" }
        object: { type: string, const: payment }
        livemode: { type: boolean, description: "false for an object of test mode, true for a live one" }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        kind: { type: string, enum: [one_time, renewal, mandate_setup] }
        amount: { type: integer }
        currency: { type: string }
        amount_received: { type: integer }
        amount_refunded: { type: integer }
        order_ref: { type: string }
        description: { type: string }
        customer_id: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        return_url: { type: string }
        allowed_connectors:
          type: array
          items: { type: string }
          description: The connectors the payment was restricted to when it was created. Every routing decision for the payment (the pay page, a retry, "pay another way", a fallback) stays inside them. Absent when unrestricted.
        country: { type: string, description: The buyer country given when the payment was created, which routing rules can match on. Absent when none was given. }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        version: { type: integer, description: Increments on every change. }
        flags:
          type: array
          items:
            type: string
            examples: [duplicate_success, duplicate_refunded, late_success, amount_mismatch, success_after_cancel]
    PaymentAttempt:
      type: object
      description: One try at paying, on one provider account. Useful for finding out why a payment failed.
      required: [id, status, provider, created_at]
      properties:
        id: { type: string, pattern: "^att_[0-9a-z]{26}$" }
        status: { type: string, enum: [created, pending, authorized, captured, failed] }
        provider: { type: string, description: "The connector, for example razorpay." }
        provider_payment_id: { type: string }
        method: { type: string, description: "For example upi, card, netbanking." }
        failure_code: { type: string }
        failure_message: { type: string }
        created_at: { type: string, format: date-time }
    PaymentDetail:
      allOf:
        - $ref: "#/components/schemas/Payment"
        - type: object
          required: [attempts]
          properties:
            attempts:
              type: array
              description: Oldest first.
              items: { $ref: "#/components/schemas/PaymentAttempt" }
    CreatedPayment:
      allOf:
        - $ref: "#/components/schemas/Payment"
        - type: object
          required: [checkout_url]
          properties:
            checkout_url:
              type: string
              format: uri
              description: "`<PAYMUX_BASE_URL>/pay/<id>?t=<secret>`. Shown only in this response."
    PaymentList:
      type: object
      required: [object, data, has_more]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        has_more: { type: boolean }
        next_cursor: { type: string, description: Pass as `starting_after` to get the next page. }
    CreateRefundRequest:
      type: object
      properties:
        amount: { type: integer, minimum: 1, description: Minor units; default is the full remaining balance. }
        attempt_id: { type: string, description: Default is the succeeded attempt. }
        reason: { type: string, maxLength: 500 }
      additionalProperties: false
    Refund:
      type: object
      required: [id, object, payment_id, attempt_id, amount, currency, status, initiated_by, created_at]
      properties:
        id: { type: string, pattern: "^ref_[0-9a-z]{26}$" }
        object: { type: string, const: refund }
        livemode: { type: boolean, description: "false for an object of test mode, true for a live one" }
        payment_id: { type: string }
        attempt_id: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        reason: { type: string }
        initiated_by: { type: string, enum: [api, dashboard, provider, system] }
        provider_refund_id: { type: string, description: "The provider's id for the refund; present once the provider has accepted it." }
        created_at: { type: string, format: date-time }
    SubscriptionStatus:
      type: string
      enum: [incomplete, incomplete_expired, trialing, active, past_due, canceled, ended]
    CreateSubscriptionRequest:
      type: object
      required: [customer, amount, currency, interval]
      properties:
        customer: { $ref: "#/components/schemas/Customer" }
        amount: { type: integer, minimum: 1, description: Minor units per period. }
        currency: { type: string, pattern: "^[A-Za-z]{3}$" }
        interval: { type: string, enum: [day, week, month, year] }
        interval_count: { type: integer, minimum: 1, maximum: 366, default: 1 }
        trial_days: { type: integer, minimum: 0, maximum: 365 }
        start_at: { type: string, format: date-time, description: First period start; default now. }
        total_count: { type: integer, minimum: 0, description: Number of periods to bill; 0 means until canceled. }
        description: { type: string, maxLength: 1000 }
        metadata:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 500 }
        return_url: { type: string, format: uri }
        method: { type: string, enum: [upi, card, emandate], description: Preferred mandate method for merchant-triggered billing; default UPI. }
        allowed_connectors:
          type: array
          maxItems: 20
          items: { type: string }
          description: Restricts routing to these connectors, as for a payment; a subscription no listed connector can bill (in this currency) is refused with 422 `no_route`. Kept on the subscription.
        country: { type: string, description: "Buyer country (ISO 3166 alpha-2), matched by routing rules. Kept on the subscription." }
      additionalProperties: false
    Subscription:
      type: object
      required: [id, object, status, billing_mode, customer_id, amount, currency, interval, interval_count, current_period_start, current_period_end, renewals_done, cancel_at_period_end, requires_reauthorization, metadata, created_at, version]
      properties:
        id: { type: string, pattern: "^sub_[0-9a-z]{26}$" }
        object: { type: string, const: subscription }
        livemode: { type: boolean, description: "false for an object of test mode, true for a live one" }
        status: { $ref: "#/components/schemas/SubscriptionStatus" }
        billing_mode: { type: string, enum: [provider_managed, merchant_triggered] }
        customer_id: { type: string }
        amount: { type: integer }
        currency: { type: string }
        interval: { type: string, enum: [day, week, month, year] }
        interval_count: { type: integer }
        current_period_start: { type: string, format: date-time }
        current_period_end: { type: string, format: date-time }
        trial_end: { type: string, format: date-time }
        total_count: { type: integer }
        renewals_done: { type: integer }
        cancel_at_period_end: { type: boolean }
        canceled_at: { type: string, format: date-time }
        ended_at: { type: string, format: date-time }
        pending_amount: { type: integer, description: Amount that applies from the next period. }
        proration_adjust: { type: integer, description: "What the next renewal changes by after a prorated plan change: a charge when positive, a credit when negative." }
        requires_reauthorization: { type: boolean }
        description: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        allowed_connectors:
          type: array
          items: { type: string }
          description: The connectors the subscription was restricted to when it was created. Absent when unrestricted.
        country: { type: string, description: The buyer country given when the subscription was created. Absent when none was given. }
        return_url: { type: string }
        mandate_id: { type: string }
        created_at: { type: string, format: date-time }
        version: { type: integer }
    CreatedSubscription:
      allOf:
        - $ref: "#/components/schemas/Subscription"
        - type: object
          properties:
            checkout_url:
              type: string
              format: uri
              description: "`<PAYMUX_BASE_URL>/s/<id>?t=<secret>`. Shown only in this response."
            proration:
              $ref: "#/components/schemas/ProrationOutcome"
    SubscriptionList:
      type: object
      required: [object, data, has_more]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Subscription" }
        has_more: { type: boolean }
        next_cursor: { type: string }
    CreatePaymentLinkRequest:
      type: object
      required: [currency]
      description: Either `amount` (a fixed price) or `min_amount` (the customer chooses), not both.
      example:
        amount: 49900
        currency: INR
        description: Pro plan, annual
        single_use: true
        expires_at: "2026-12-31T18:00:00Z"
        return_url: https://shop.example.com/thanks
        metadata: { sku: pro-annual }
      properties:
        amount: { type: integer, minimum: 1, description: Fixed price in minor units. }
        min_amount: { type: integer, minimum: 1, description: Smallest amount the customer may enter. }
        max_amount: { type: integer, minimum: 1, description: Largest amount the customer may enter; omit for no limit. }
        currency: { type: string, pattern: "^[A-Za-z]{3}$" }
        description: { type: string, maxLength: 1000, description: Shown on the link's page and copied to each payment. }
        single_use: { type: boolean, default: false, description: Switch the link off after the first successful payment. }
        expires_at: { type: string, format: date-time, description: After this the page takes no payments. At most five years ahead. }
        return_url: { type: string, format: uri, description: Where the customer returns after paying; default is the app's. }
        metadata:
          type: object
          maxProperties: 19
          additionalProperties: { type: string, maxLength: 500 }
          description: Copied to every payment created from the link. The key `payment_link_id` is reserved.
      additionalProperties: false
    PaymentLink:
      type: object
      example:
        id: plink_01hxyzabcdefghjkmnpqrstvw0
        object: payment_link
        url: https://pay.example.com/l/k3n9x0q7vb2m
        slug: k3n9x0q7vb2m
        app_id: app_01hxyzabcdefghjkmnpqrstvw0
        amount: 49900
        currency: INR
        description: Pro plan, annual
        return_url: https://shop.example.com/thanks
        single_use: true
        active: true
        expires_at: "2026-12-31T18:00:00Z"
        metadata: { sku: pro-annual }
        created_at: "2026-10-17T12:00:00Z"
        version: 1
      required: [id, object, url, slug, app_id, amount, currency, single_use, active, expires_at, metadata, created_at, version]
      properties:
        id: { type: string, pattern: "^plink_[0-9a-z]{26}$" }
        object: { type: string, const: payment_link }
        livemode: { type: boolean, description: "false for an object of test mode, true for a live one" }
        url: { type: string, format: uri, description: "`<PAYMUX_BASE_URL>/l/<slug>`; share this." }
        slug: { type: string, pattern: "^[a-z0-9]{12}$" }
        app_id: { type: string }
        amount: { type: [integer, "null"], description: The fixed price; null when the customer chooses. }
        min_amount: { type: integer }
        max_amount: { type: integer }
        currency: { type: string }
        description: { type: string }
        return_url: { type: string }
        single_use: { type: boolean }
        active: { type: boolean }
        expires_at: { type: [string, "null"], format: date-time }
        metadata: { type: object, additionalProperties: { type: string } }
        deactivated_at: { type: string, format: date-time }
        deactivated_reason: { type: string, enum: [manual, used] }
        created_at: { type: string, format: date-time }
        version: { type: integer }
    PaymentLinkList:
      type: object
      required: [object, data, has_more]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/PaymentLink" }
        has_more: { type: boolean }
        next_cursor: { type: string }
    Invoice:
      type: object
      description: |
        A GST tax invoice. Amounts are minor units of `currency`; the total always
        equals the amount received. Immutable once issued; corrections are credit
        notes. Customers open it at `/i/<id>?t=<token>` (the `invoice.issued`
        event carries the signed `hosted_url` and `pdf_url`).
      required: [id, object, number, payment_id, issued_at, supply_type, place_of_supply, currency, taxable, cgst, sgst, igst, total, flags, template_version, pdf_ready]
      properties:
        id: { type: string, pattern: "^inv_[0-9a-z]{26}$" }
        object: { type: string, const: invoice }
        livemode: { type: boolean, description: "false for an object of test mode, true for a live one" }
        number: { type: string, examples: ["INV/2627/000123"] }
        payment_id: { type: string }
        subscription_id: { type: string }
        issued_at: { type: string, format: date-time }
        supply_type: { type: string, enum: [b2b, b2c, export_lut, export_igst] }
        place_of_supply: { type: string, description: 2-digit state code or OUTSIDE_INDIA. }
        currency: { type: string }
        supplier: { type: object, description: Supplier snapshot at issue time. }
        recipient: { type: object, description: Recipient snapshot at issue time. }
        lines: { type: array, items: { type: object } }
        taxable: { type: integer }
        cgst: { type: integer }
        sgst: { type: integer }
        igst: { type: integer }
        total: { type: integer }
        fx_rate_inr: { type: string, description: INR per unit of a foreign currency, for exports. }
        flags:
          type: array
          items:
            type: string
            examples: [pos_defaulted, fx_pending, export_igst, recipient_invalid]
        template_version: { type: string }
        pdf_ready: { type: boolean }
        irn: { type: string, pattern: "^[0-9a-f]{64}$", description: "E-invoice Invoice Reference Number, once the operator has registered the invoice at the GST portal and recorded the answer." }
        ack_no: { type: string, description: Acknowledgement number from the portal. }
        ack_date: { type: string, format: date-time, description: Acknowledgement date from the portal. }
    InvoiceList:
      type: object
      required: [object, data, has_more]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Invoice" }
        has_more: { type: boolean }
    CreditNote:
      type: object
      description: A credit note issued when a refund succeeds. Credits taxable value and tax in proportion; all credit notes of an invoice sum to at most its total.
      required: [id, object, number, invoice_id, payment_id, issued_at, reason, currency, taxable, cgst, sgst, igst, total, flags, template_version, pdf_ready]
      properties:
        id: { type: string, pattern: "^crn_[0-9a-z]{26}$" }
        object: { type: string, const: credit_note }
        livemode: { type: boolean, description: "false for an object of test mode, true for a live one" }
        number: { type: string, examples: ["CN/2627/000045"] }
        invoice_id: { type: string }
        payment_id: { type: string }
        refund_id: { type: string }
        dispute_id: { type: string }
        issued_at: { type: string, format: date-time }
        reason: { type: string }
        currency: { type: string }
        lines: { type: array, items: { type: object } }
        taxable: { type: integer }
        cgst: { type: integer }
        sgst: { type: integer }
        igst: { type: integer }
        total: { type: integer }
        flags: { type: array, items: { type: string } }
        template_version: { type: string }
        pdf_ready: { type: boolean }
    CreditNoteList:
      type: object
      required: [object, data, has_more]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/CreditNote" }
        has_more: { type: boolean }
    ProrationOutcome:
      type: object
      description: What a prorated plan change did.
      required: [requested, mode, amount]
      properties:
        requested: { type: string, enum: [none, next_invoice, immediate] }
        mode:
          type: string
          enum: [none, next_invoice, immediate]
          description: What happened; differs from `requested` when an immediate charge fell back to the next renewal, or there was nothing to prorate.
        amount:
          type: integer
          description: Signed difference for the rest of the period in minor units; positive is a charge, negative a credit.
        description: { type: string }
        charge_at:
          type: string
          format: date-time
          description: When an `immediate` charge will be made, at the earliest.
        reason: { type: string, description: Why the mode differs from the request, or why nothing was prorated. }
    PayoutStatus:
      type: string
      enum: [pending, processing, succeeded, failed, reversed, needs_review]
      description: |
        `pending` is recorded and not yet with the provider; `processing` is on its way; `succeeded` has arrived;
        `failed` will not arrive (the money stays with you); `reversed` arrived and came back. A status the
        provider reports that Paymux does not know stays `processing`.

        `needs_review` means the outcome is unknown: the submission to the provider kept ending in a timeout or a
        cut connection, so the provider may or may not have the payout. Paymux stops sending, asks the provider for
        it by its reference, and raises an ops alert; the payout moves on when the provider answers. Treat it as
        possibly paid. A `failed` payout whose failure Paymux concluded itself (not the provider) is likewise
        checked with the provider, and can become `processing` or `succeeded` (a `payout.failed` event is then
        followed by the later one).
    Payout:
      type: object
      required: [id, object, status, amount, currency, beneficiary, metadata, created_at, version]
      properties:
        id: { type: string, pattern: "^po_[0-9a-z]{26}$" }
        object: { type: string, const: payout }
        livemode: { type: boolean, description: "false for an object of test mode, true for a live one" }
        status: { $ref: "#/components/schemas/PayoutStatus" }
        amount: { type: integer }
        currency: { type: string }
        beneficiary:
          type: object
          required: [label]
          properties:
            label: { type: string, description: "Masked destination, e.g. `••••9012 HDFC` or `ra•••@okbank`." }
        narration: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        failure_code: { type: string }
        failure_message: { type: string }
        created_at: { type: string, format: date-time }
        completed_at: { type: string, format: date-time }
        version: { type: integer }
    PayoutList:
      type: object
      required: [object, data, has_more]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Payout" }
        has_more: { type: boolean }
        next_cursor: { type: string }
