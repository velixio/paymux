openapi: 3.1.0
info:
  title: Paymux API
  version: 0.1.0
  summary: Create and manage payments and refunds.
  description: |
    All amounts are integers in minor units (paise for INR) with an ISO 4217
    currency code. Timestamps are RFC 3339 UTC.

    **Authentication.** Send `Authorization: Bearer pmx_{test|live}_sk_<key>`.
    The key decides the app and the mode: a `test` key only sees test data and
    a `live` key only live data.

    **Idempotency.** `POST` requests may carry an `Idempotency-Key` header
    (up to 255 characters). The same key with the same method, path and body
    within 24 hours returns the stored response (marked
    `Idempotent-Replay: true`). The same key with a different request returns
    409 `idempotency_key_reuse`. A repeat while the first is still running
    returns 409 `idempotency_in_progress`. Responses with status 5xx are not
    stored, so those requests can be retried.

    **Errors** share one shape: `{"error": {"type", "message", "request_id"}}`.
servers:
  - url: "{baseUrl}"
    variables:
      baseUrl:
        default: https://pay.example.com
security:
  - bearerAuth: []
paths:
  /v1/payments:
    post:
      operationId: createPayment
      summary: Create a payment
      description: |
        Creates a payment in status `created` and returns a `checkout_url` of
        the form `<PAYMUX_BASE_URL>/pay/<id>?t=<secret>`. The secret is shown
        once and valid until `expires_at`.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "201":
          description: Payment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedPayment"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "409":
          $ref: "#/components/responses/IdempotencyConflict"
        "422":
          description: |
            `no_route` (no provider account can take this payment) or
            `currency_not_accepted` (a routing rule rejects it; the message is the rule's).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          $ref: "#/components/responses/InvalidRequest"
    get:
      operationId: listPayments
      summary: List payments
      description: Newest first, cursor-paginated.
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
        - name: starting_after
          in: query
          description: The `next_cursor` of the previous page.
          schema: { type: string }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/PaymentStatus" }
      responses:
        "200":
          description: A page of payments.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentList"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
  /v1/payments/{id}:
    get:
      operationId: getPayment
      summary: Retrieve a payment
      parameters:
        - $ref: "#/components/parameters/PaymentId"
      responses:
        "200":
          description: The payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
  /v1/payments/{id}/cancel:
    post:
      operationId: cancelPayment
      summary: Cancel a payment
      description: |
        Only payments in `created` or `requires_action` can be canceled.
        Canceling a canceled payment returns it unchanged. A late success after
        a cancel moves the payment to `needs_review`; it is never refunded
        automatically.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      responses:
        "200":
          description: The canceled payment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Payment"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/StateConflict"
  /v1/payments/{id}/refunds:
    post:
      operationId: createRefund
      summary: Refund a payment
      description: |
        Refunds the succeeded attempt (or `attempt_id`). `amount` defaults to
        everything still refundable. The refund starts `pending` and is sent to
        the provider asynchronously.
      parameters:
        - $ref: "#/components/parameters/PaymentId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRefundRequest"
      responses:
        "201":
          description: Refund created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/RefundConflict"
  /v1/refunds/{id}:
    get:
      operationId: getRefund
      summary: Retrieve a refund
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, pattern: "^ref_[0-9a-z]{26}$" }
      responses:
        "200":
          description: The refund.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Refund"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "`pmx_test_sk_...` or `pmx_live_sk_...`"
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema: { type: string, maxLength: 255 }
    PaymentId:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^pay_[0-9a-z]{26}$" }
  responses:
    InvalidRequest:
      description: The request is invalid (`invalid_request`), or the body is over 1 MiB (413).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthenticated:
      description: Missing, malformed, unknown or revoked API key (`authentication_error`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: No such object for this app and mode (`not_found`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    StateConflict:
      description: The object is in a state that does not allow this (`invalid_state`).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    IdempotencyConflict:
      description: |
        `idempotency_key_reuse` (same key, different request) or
        `idempotency_in_progress` (the first request is still running).
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    RefundConflict:
      description: |
        `not_refundable` (no succeeded attempt), `refund_amount_exceeds_balance`,
        or an idempotency conflict.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [type, message, request_id]
          properties:
            type:
              type: string
              enum:
                - invalid_request
                - authentication_error
                - permission_error
                - not_found
                - invalid_state
                - not_refundable
                - refund_amount_exceeds_balance
                - conflict
                - no_route
                - currency_not_accepted
                - idempotency_key_reuse
                - idempotency_in_progress
                - internal
            message: { type: string }
            request_id: { type: string }
    PaymentStatus:
      type: string
      enum: [created, requires_action, processing, succeeded, failed, expired, canceled, needs_review]
    Customer:
      type: object
      properties:
        external_ref: { type: string, maxLength: 255, description: Your id for the customer; repeat calls update the same customer. }
        name: { type: string, maxLength: 200 }
        email: { type: string, maxLength: 254 }
        phone: { type: string, maxLength: 32 }
        billing:
          type: object
          properties:
            legal_name: { type: string }
            gstin: { type: string }
            line1: { type: string }
            line2: { type: string }
            city: { type: string }
            state_code: { type: string }
            postal_code: { type: string }
            country: { type: string }
          additionalProperties: false
      additionalProperties: false
    CreatePaymentRequest:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: integer, minimum: 1, description: Minor units. }
        currency: { type: string, pattern: "^[A-Za-z]{3}$", description: ISO 4217. }
        order_ref: { type: string, maxLength: 255 }
        description: { type: string, maxLength: 1000 }
        customer: { $ref: "#/components/schemas/Customer" }
        metadata:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 500 }
          description: Up to 20 string keys (key length 1-40).
        return_url: { type: string, format: uri, description: "Absolute http(s) URL. Defaults to the app's return URL." }
        allowed_connectors:
          type: array
          items: { type: string }
          description: Restricts routing to these connectors.
        country: { type: string, description: Buyer country, matched by routing rules. }
      additionalProperties: false
    Payment:
      type: object
      required: [id, object, status, kind, amount, currency, amount_received, amount_refunded, metadata, expires_at, created_at, version, flags]
      properties:
        id: { type: string, pattern: "^pay_[0-9a-z]{26}$" }
        object: { type: string, const: payment }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        kind: { type: string, enum: [one_time, renewal, mandate_setup] }
        amount: { type: integer }
        currency: { type: string }
        amount_received: { type: integer }
        amount_refunded: { type: integer }
        order_ref: { type: string }
        description: { type: string }
        customer_id: { type: string }
        metadata: { type: object, additionalProperties: { type: string } }
        return_url: { type: string }
        expires_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        version: { type: integer, description: Increments on every change. }
        flags:
          type: array
          items:
            type: string
            examples: [duplicate_success, late_success, amount_mismatch, success_after_cancel]
    CreatedPayment:
      allOf:
        - $ref: "#/components/schemas/Payment"
        - type: object
          required: [checkout_url]
          properties:
            checkout_url:
              type: string
              format: uri
              description: "`<PAYMUX_BASE_URL>/pay/<id>?t=<secret>`. Shown only in this response."
    PaymentList:
      type: object
      required: [object, data, has_more]
      properties:
        object: { type: string, const: list }
        data:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        has_more: { type: boolean }
        next_cursor: { type: string, description: Pass as `starting_after` to get the next page. }
    CreateRefundRequest:
      type: object
      properties:
        amount: { type: integer, minimum: 1, description: Minor units; default is the full remaining balance. }
        attempt_id: { type: string, description: Default is the succeeded attempt. }
        reason: { type: string, maxLength: 500 }
      additionalProperties: false
    Refund:
      type: object
      required: [id, object, payment_id, attempt_id, amount, currency, status, initiated_by, created_at]
      properties:
        id: { type: string, pattern: "^ref_[0-9a-z]{26}$" }
        object: { type: string, const: refund }
        payment_id: { type: string }
        attempt_id: { type: string }
        amount: { type: integer }
        currency: { type: string }
        status: { type: string, enum: [pending, succeeded, failed] }
        reason: { type: string }
        initiated_by: { type: string, enum: [api, dashboard, provider, system] }
        created_at: { type: string, format: date-time }
